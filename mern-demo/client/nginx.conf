server {
    listen 80;
    server_name localhost;

    # Phục vụ file tĩnh React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp ngầm tất cả request /api/ sang Backend Render thật
    location /api/ {
        proxy_pass https://mern-backend-238050-568q.onrender.com/api/;
        proxy_ssl_server_name on;
    }
}